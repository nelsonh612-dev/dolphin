name: Orca Lite Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - orca-lite
  pull_request:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NDK_VERSION: "30.0.15729638"
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history: the Gradle build derives versionName/versionCode from git.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The ubuntu runner ships an Android SDK; use its sdkmanager directly.
      # (android-actions/setup-android tries to install the removed 'tools' package.)
      - name: Install Android NDK and CMake
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;${NDK_VERSION}" "cmake;3.31.6"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('Source/Android/**/*.gradle.kts', 'Source/Android/gradle/**') }}

      - name: Build debug APK (arm64)
        working-directory: Source/Android
        run: ./gradlew --no-daemon assembleDebug -PorcaAbis=arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orca-lite-debug-arm64
          path: Source/Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
