name: Orca Lite Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - orca-lite
      - orca-lite-jit-stats
  pull_request:

permissions:
  contents: write

jobs:
  build-apk:
    name: build-apk (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # JIT diagnostics only exist in the ARM64 JIT.
        abi: [arm64-v8a]
    timeout-minutes: 120
    env:
      NDK_VERSION: "30.0.15729638"
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history: the Gradle build derives versionName/versionCode from git.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The ubuntu runner ships an Android SDK; use its sdkmanager directly.
      # (android-actions/setup-android tries to install the removed 'tools' package.)
      - name: Install Android NDK and CMake
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;${NDK_VERSION}" "cmake;3.31.6"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('Source/Android/**/*.gradle.kts', 'Source/Android/gradle/**') }}

      # Release build: R8-optimized Kotlin/Java and no JNI debugging.
      # Signed with the ORCA_KEYSTORE_B64 secret if it exists; otherwise with the
      # public TEST-ONLY key in Source/Android/orca-test.keystore, so test builds
      # keep the same signature and can be updated without uninstalling.
      # Never publish a build signed with the test key.
      - name: Build release APK (${{ matrix.abi }})
        working-directory: Source/Android
        env:
          KEYSTORE_B64: ${{ secrets.ORCA_KEYSTORE_B64 }}
          STOREPASS: ${{ secrets.ORCA_STOREPASS }}
          KEYALIAS: ${{ secrets.ORCA_KEYALIAS }}
          KEYPASS: ${{ secrets.ORCA_KEYPASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/orca.keystore"
            SIGN="-Pkeystore=$RUNNER_TEMP/orca.keystore -Pstorepass=$STOREPASS -Pkeyalias=$KEYALIAS -Pkeypass=$KEYPASS"
          else
            echo "::warning::Using the public TEST-ONLY signing key."
            SIGN="-Pkeystore=$PWD/orca-test.keystore -Pstorepass=orcatest -Pkeyalias=orcatest -Pkeypass=orcatest"
          fi
          ./gradlew --no-daemon assembleRelease -PorcaAbis=${{ matrix.abi }} $SIGN

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orca-lite-release-${{ matrix.abi }}
          path: Source/Android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      # Direct download for phones: GitHub artifacts need a login and come zipped.
      # Every push to orca-lite-jit-stats replaces the APK in a prerelease.
      - name: Publish APK as prerelease (orca-lite-jit-stats)
        if: github.event_name == 'push' && github.ref == 'refs/heads/orca-lite-jit-stats'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=orca-lite-jit-stats-latest
          APK=$(ls Source/Android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" OrcaLite-jit-stats.apk
          gh release delete "$TAG" --cleanup-tag --yes -R "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" OrcaLite-jit-stats.apk -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Orca Lite - prueba JIT stats (${GITHUB_SHA::7})" \
            --notes "APK de prueba (Fase 1, diagnostico JIT). Firmado con la clave de PRUEBA: no publicar."
