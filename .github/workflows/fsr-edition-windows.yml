name: Windows x64 build

on:
  workflow_dispatch:
  push:
    branches:
      - fsr3-frame-generation
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify build tools
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          cl

      - name: Configure and build Dolphin
        shell: pwsh
        run: cmake --workflow --preset ninja-release-x64

      - name: Upload Dolphin executable and build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-fsr-edition-windows-x64
          path: build/release/x64/Binaries/**
          if-no-files-found: warn
          retention-days: 14
