name: Windows x64 build

on:
  workflow_dispatch:
  push:
    branches:
      - fsr3-frame-generation
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Set up MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify build tools
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          cl

      - name: Configure and build Dolphin
        shell: pwsh
        run: cmake --workflow --preset ninja-release-x64

      - name: Verify Windows runtime package contents
        shell: pwsh
        run: |
          $binaryDir = Join-Path $env:GITHUB_WORKSPACE "build/release/x64/Binaries"
          $requiredFiles = @(
            "Dolphin.exe",
            "DolphinTool.exe",
            "Updater.exe",
            "qt.conf",
            "Qt6Core.dll",
            "Qt6Gui.dll",
            "Qt6Svg.dll",
            "Qt6Widgets.dll",
            "QtPlugins/platforms/qwindows.dll",
            "Sys/Resources/OSD_Font.ttf",
            "Sys/Shaders/FSR1_EASU.glsl",
            "Sys/Shaders/FSR1_RCAS.glsl",
            "Sys/Shaders/FSR_Spatial.glsl"
          )
          foreach ($relativePath in $requiredFiles) {
            $file = Join-Path $binaryDir $relativePath
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Required runtime package file is missing: $relativePath"
            }
            # Qt's deployment step may intentionally emit an empty qt.conf.
            # It is a valid empty configuration file; all binaries, DLLs, plugins,
            # fonts, and shader assets must still contain data.
            if ($relativePath -ne "qt.conf" -and (Get-Item -LiteralPath $file).Length -le 0) {
              throw "Required runtime package file is empty: $relativePath"
            }
          }
          $dolphin = Get-Item -LiteralPath (Join-Path $binaryDir "Dolphin.exe")
          Write-Host ("Verified {0} required package files; Dolphin.exe is {1} bytes." -f $requiredFiles.Count, $dolphin.Length)

      - name: Upload Dolphin executable and build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-fsr-edition-windows-x64
          path: build/release/x64/Binaries/**
          if-no-files-found: error
          retention-days: 14

  shader-syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install GLSL validator
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
      - name: Run shader configuration regression tests
        run: python3 -m unittest discover -s tools/tests -p "test_*.py" -v
      - name: Compile-check FSR shader sources
        run: |
          python3 tools/validate_fsr_shaders.py \
            Data/Sys/Shaders/FSR1_EASU.glsl \
            Data/Sys/Shaders/FSR_Spatial.glsl \
            Data/Sys/Shaders/FSR1_RCAS.glsl
